<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Task Control - Authentication</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4b4b4b;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd0d5;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

            input:focus {
                outline: none;
                border-color: #007bff;
                box-shadow: 0 0 0 2px rgba(0,123,255,0.2);
            }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
            margin-top: 10px;
        }

            button:hover {
                background: #0056b3;
            }

        .error {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
        }

        /* Styling for the Toggle Link */
        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #65676b;
        }

            .toggle-link span {
                color: #007bff;
                cursor: pointer;
                font-weight: 600;
            }

                .toggle-link span:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Dynamic header changes between "System Login" and "Create Account" -->
        <h2 id="formTitle">System Login</h2>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="e.g., john_doe">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <!-- Single button that runs different code based on the mode -->
        <button id="submitBtn" onclick="handleSubmit()">Sign In</button>
        <div id="errorMessage" class="error"></div>

        <!-- Navigation link to flip modes -->
        <div class="toggle-link" id="toggleWrapper">
            Don't have an account? <span onclick="toggleMode(true)">Sign Up</span>
        </div>
    </div>

    <script>
        let isSignUpMode = false; // False = Login mode, True = Registration mode
        const apiPath = '/api/auth';

        // Flips the UI text between Login and Registration layouts
        function toggleMode(signUp) {
            isSignUpMode = signUp;
            const formTitle = document.getElementById('formTitle');
            const submitBtn = document.getElementById('submitBtn');
            const toggleWrapper = document.getElementById('toggleWrapper');
            const errDiv = document.getElementById('errorMessage');

            errDiv.style.display = 'none'; // Clear any old errors

            if (isSignUpMode) {
                formTitle.textContent = "Create Account";
                submitBtn.textContent = "Register Account";
                toggleWrapper.innerHTML = `Already have an account? <span onclick="toggleMode(false)">Sign In</span>`;
            } else {
                formTitle.textContent = "System Login";
                submitBtn.textContent = "Sign In";
                toggleWrapper.innerHTML = `Don't have an account? <span onclick="toggleMode(true)">Sign Up</span>`;
            }
        }

        // Directs the button click to the correct function
        function handleSubmit() {
            if (isSignUpMode) {
                handleSignUp();
            } else {
                handleLogin();
            }
        }

        // 🔐 Handles login request
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('errorMessage');

            if (!username || !password) {
                errDiv.textContent = "Please fill in all fields.";
                errDiv.style.display = 'block';
                return;
            }

            try {
                const url = `${apiPath}/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                const response = await fetch(url, { method: 'POST' });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('jwtToken', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('userRole', data.role);
                    window.location.href = '/index.html';
                } else {
                    errDiv.textContent = "Invalid username or password.";
                    errDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errDiv.textContent = "Server connection lost. Try again later.";
                errDiv.style.display = 'block';
            }
        }

        // 📡 Handles sending the sign-up credentials to the server
        async function handleSignUp() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('errorMessage');

            if (!username || !password) {
                errDiv.textContent = "Please choose a username and password.";
                errDiv.style.display = 'block';
                return;
            }

            try {
                // Sends username and password, with role automatically hardcoded to 'User'
                const url = `${apiPath}/register?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&role=User`;
                const response = await fetch(url, { method: 'POST' });

                if (response.ok) {
                    alert('Registration successful! You can now log in.');
                    toggleMode(false); // Return to the standard login screen automatically
                } else {
                    const errorText = await response.text();
                    errDiv.textContent = errorText || "Registration failed. Username might be taken.";
                    errDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Registration error:', error);
                errDiv.textContent = "Server connection lost. Try again later.";
                errDiv.style.display = 'block';
            }
        }

        // Submits form automatically when user presses Enter key
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSubmit();
            }
        });
    </script>
</body>
</html>
